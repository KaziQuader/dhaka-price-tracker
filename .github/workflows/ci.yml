name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # Same Postgres major version and host port as docker-compose.yml, so `make test`
    # (which connects to localhost:5433) works unchanged.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: tracker
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ci-only
      POSTGRES_DB: tracker

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # The runner ships newer pg_dump/pg_restore, whose dumps a Postgres 16 server can't
      # restore. Use client 16 (same as the collector image) so the backup round trip runs.
      # It comes from the PostgreSQL apt repo (PGDG), which has every version for every
      # Ubuntu release; Ubuntu's own repo only has the release's default version.
      - name: Install Postgres 16 client tools
        run: |
          . /etc/os-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"

      - name: Lint
        run: make lint

      - name: Test
        run: make test
