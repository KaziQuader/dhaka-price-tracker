[project]
name = "tracker"
version = "0.1.0"
description = "Local tracker and predictor for BAJUS gold prices and airfares from Dhaka."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added by the ticket that first needs them (see IMPLEMENTATION_PLAN.md §3).
dependencies = [
    "alembic>=1.20.1",
    "playwright>=1.65.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dbt/target", "dbt/logs"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, UP: modern syntax, B: likely bugs.
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: needs a running Postgres (skipped when it is unreachable)",
]
