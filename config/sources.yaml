# Per-source settings: enable flag, politeness and URLs.
# The orchestrator runs enabled sources in the order listed here. The key is also the
# collector module name: `dummy` -> src/tracker/collectors/dummy.py.
#
# Shape of an entry:
#   <source_name>:
#     enabled: true
#     min_interval_s: 5      # minimum seconds between requests to this source's domain
#     urls:
#       <name>: https://...
sources:
  # Pipeline check only (T0.3). Run with `make collect SOURCES=dummy`.
  dummy:
    enabled: false
    min_interval_s: 1
    urls:
      page: https://example.com/
