# Local stack (IMPLEMENTATION_PLAN.md §2). Values like ${POSTGRES_USER} come from .env.
name: dhaka-price-tracker

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # Host port 5433, not 5432: this machine already runs a local Postgres on 5432.
    # Bound to 127.0.0.1 so the database is not reachable from the network.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:v0.65.6.3
    environment:
      # Metabase's own settings live in an H2 file on its own volume, separate from our data.
      MB_DB_FILE: /metabase-data/metabase.db
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - mbdata:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy

  collector:
    build: .
    # Only started on demand (`docker compose run collector ...`), never by `make up`.
    profiles: [run]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./config:/app/config:ro
      - ./dbt:/app/dbt
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  mbdata:
